
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Immersive Audio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --portal-green: #14B8A6;
        --dark-magenta: #8B008B;
        --midnight: #02040a; 
        --deep-blue: #02040a;
        --deep-violet: #2e1065;
        --neon-pink: #ff00ff;
        --neon-red: #ff3131;
        --neon-blue: #00ffff;
      }

      body {
        font-family: 'Inter', sans-serif;
        background: var(--midnight);
        color: #e2e8f0;
        overflow-x: hidden;
        margin: 0;
        min-height: 100vh;
      }

      .font-serif {
        font-family: 'Spectral', serif;
      }

      /* Portal UI Elements */
      .portal-field {
        background: rgba(5, 7, 10, 0.6);
        backdrop-filter: blur(30px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 3rem;
        box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
        transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .portal-field:hover {
        border-color: rgba(20, 184, 166, 0.25);
        background: rgba(5, 7, 10, 0.7);
        box-shadow: 0 15px 50px 0 rgba(0, 0, 0, 0.6);
      }

      .glass-button {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        transition: all 0.5s ease;
      }

      .glass-button:hover {
        background: rgba(20, 184, 166, 0.15);
        border-color: var(--portal-green);
        box-shadow: 0 0 25px rgba(20, 184, 166, 0.3);
      }

      .glow-text {
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
      }

      @keyframes breath-pulse {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.03); }
      }

      .animate-breath {
        animation: breath-pulse 6s infinite ease-in-out;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes zoom-in {
        from { 
          opacity: 0;
          transform: scale(0.95);
        }
        to { 
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes slide-in-from-top {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slide-in-from-bottom {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-in {
        animation: fade-in 0.5s ease-out;
      }

      .fade-in {
        animation: fade-in 0.5s ease-out;
      }

      .zoom-in-95 {
        animation: zoom-in 1s ease-out;
      }

      .slide-in-from-top-4 {
        animation: slide-in-from-top 0.5s ease-out;
      }

      .slide-in-from-bottom-4 {
        animation: slide-in-from-bottom 0.5s ease-out;
      }

      .duration-1000 {
        animation-duration: 1s;
      }

      .duration-700 {
        animation-duration: 0.7s;
      }

      .duration-500 {
        animation-duration: 0.5s;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Background Video Styles */
      .background-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -50;
        opacity: 1; /* Temporarily set to full opacity for debugging */
        /* filter: blur(1px); */ /* Commented out blur for debugging */
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
      }
    }
    </script>
  </head>
  <body>
    <!-- Video Background -->
    <video
      id="background-video"
      class="background-video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      onloadeddata="console.log('Video loaded successfully')"
      onerror="console.error('Video failed to load:', this.error)"
    >
      <source src="/background-video.mp4" type="video/mp4">
      <!-- Temporary fallback for testing -->
      <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>

    <div id="root"></div>
    <script>
      // Debug video loading
      setTimeout(() => {
        const video = document.getElementById('background-video');
        console.log('Video element:', video);
        console.log('Video readyState:', video.readyState);
        console.log('Video currentSrc:', video.currentSrc);
        console.log('Video error:', video.error);
        console.log('Video networkState:', video.networkState);
      }, 2000);
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
